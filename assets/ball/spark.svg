<!--
  灵动 — a four-point sparkle with a smaller companion, the flat-and-geometric
  register Fluent uses for assistant marks.

  Chosen because the ball is a mouth for the agent: a sparkle says "say something
  and something happens" without repeating the whale the app icon already is.
  Source for payload/opt/dsh/android/ball/spark.png.
-->
