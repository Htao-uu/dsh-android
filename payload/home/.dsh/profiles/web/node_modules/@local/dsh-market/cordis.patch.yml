# dsh-market bundle patch: mounts the plugin market into a dsh profile.
#
# 装法（二选一）：
#   * Plugin Manager → 安装 bundle → target 选这个目录（走 harness 自己的安装流程）
#   * dsh plugin --profile web add /mnt/Documents/dsh-plugins/dsh-market
#     然后确认 profile package.json 的 "dsh.profile.bundles" 里有 "@local/dsh-market"
#
# 挂载后：
#   * host 半注册一条鉴权同源路由 GET /dsh-market/catalog（官方随包目录 + npm 在线目录 + 已安装）
#   * client 半在右侧栏加一个「插件市场」标签页，安装/启用/停用全部走
#     @deepseek-ai/dsh-plugin-manager 的 Remote API —— 不手改 profile 文件
- insert:
    - id: dsh-market
      name: '@local/dsh-market'
      config:
        online: true
        searchText: 'keywords:dsh-plugin'
