# ball-summarizer bundle patch: mounts the ball status plugin into a dsh profile.
#
# Enable (either works):
#   * Plugin Manager → 安装 bundle → target 选这个目录（推荐，走 harness 自己的安装流程）
#   * dsh plugin --profile web add /mnt/Documents/dsh-plugins/ball-summarizer
#     然后确认 profile package.json 的 "dsh.profile.bundles" 里有 "@local/dsh-ball-summarizer"
#
# 挂载后它做两件事，都不调用任何模型：
#   1. 通过 system-prompt/assemble waterfall 给**每个工具 schema** 加上必填字段
#      ball_doing（描述：你现在在做什么），模型每次调工具都必须填；
#   2. 监听 session/event，把状态推到悬浮球：step/start → think「思考中」，
#      tool/call → work + 该次调用的 ball_doing，tool/result → work「读取输出」，
#      turn 结束 → done → idle。
- insert:
    - id: ball-summarizer
      name: '@local/dsh-ball-summarizer'
      config:
        field: ball_doing
        required: true
        refreshMs: 18000
