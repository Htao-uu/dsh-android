# agent-browser-viewer bundle patch: mounts the Sidebar tab into a dsh profile.
#
# Install: dsh plugin --profile web add <this directory>
- insert:
    - id: agent-browser-view
      name: '@local/agent-browser-viewer'
      config:
        # Screenshot directory to watch; defaults to /mnt/Documents/browser-screenshots,
        # where the dsh-browser plugin's browser_screenshot tool writes by default.
        dir: /mnt/Documents/browser-screenshots
