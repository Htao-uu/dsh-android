<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DSH 悬浮球</title>
<style>
:root{--surface:#1B1D21;--hairline:rgba(255,255,255,.16);--ink:#fff;--size:58px;
  /* One shadow entry per state, in the same order, so the two states interpolate.
     Order: drop shadow, tighter second shadow, inner bottom shade, top highlight.
     The window is exactly the ball's square when closed, so an OUTER shadow has
     no room at the four points where the circle touches the window: measured on
     the device it left a dark sliver cut off at the window edge (189 vs 250).
     Closed therefore uses the inset shade only; open has 8 dp of headroom above
     and below the capsule, and 10 px of blur stays inside it. */
  --shadow-rest:0 0 0 0 rgba(0,0,0,0),0 0 0 0 rgba(0,0,0,0),inset 0 -5px 10px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.09);
  --shadow-open:0 3px 10px rgba(0,0,0,.20),0 1px 3px rgba(0,0,0,.14),inset 0 0 0 0 rgba(0,0,0,0),inset 0 1px 0 rgba(255,255,255,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
/* ONE page, ONE capsule, ONE window.
 *
 * This page is the whole ball and the whole typing bar. The app's window is the
 * ball's square while closed and the bar's rect while open, and the app animates
 * that window frame by frame; this page only ever fills it. Nothing here draws a
 * second capsule, so nothing here can cover the morph from another window.
 *
 * Capsule geometry: it spans the window's full width and is exactly `--size`
 * tall, centred in the window. Closed (window == ball) it therefore IS the ball;
 * open (window == size + 16 dp tall) the capsule sits on the ball's own vertical
 * centre with 8 dp of window above and below it. One rule, both states.
 */
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#bar{position:absolute;left:0;right:0;top:calc(50% - var(--size) / 2);height:var(--size);
  display:flex;align-items:center;border:1px solid var(--hairline);border-radius:999px;
  background:var(--surface);overflow:hidden;
  box-shadow:var(--shadow-rest);transition:box-shadow .35s ease}
/* The closed ball breathes, and every frame stays at or below scale(1): the
   window is the ball's square, so a scale above 1 would be clipped into a flat
   edge by the window bounds. Same reason the press animation only shrinks. */
#bar.ball{animation:breathe 3.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.972)}50%{transform:scale(1)}}
#bar.full{box-shadow:var(--shadow-open)}
/* The bubble: THIS window, stretched off the ball. Same capsule, same skin, the
   ball's own height; only the width comes from the text. The text block keeps the
   width it was measured at while the window grows, so the line is revealed
   instead of re-wrapping on every frame of the morph. */
#bar.bubble{top:0;height:100%}
/* The whale stays: it is the capsule's starting end, exactly the square it
   occupied while the ball was closed, so expanding the ball into the bubble
   leaves it where it was. Only the typing bar's controls go away. */
#bar.bubble #send,#bar.bubble #close,#bar.bubble #field{display:none}
/* The phase marker rides on the whale's corner instead of taking a slot of its
   own: the spinning ◐ for work, ✓ for done, … while thinking, nothing for a
   plain line. */
#badge{position:absolute;right:6px;bottom:6px;width:12px;height:12px;display:none;
  box-sizing:border-box;border-radius:50%;place-items:center;background:var(--surface);
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.5);
  color:var(--ink);font:600 9px/1 var(--font);text-align:center;
  text-shadow:none;pointer-events:none}
/* Nothing of the bubble's furniture is drawn on the closed ball — no ✓ badge and
   no ring. Without this the badges rely on JavaScript having cleared them, and a
   ✓ left behind was clipped by the ball's circle into "a few stray pixels" in the
   corner. The rule is state-driven on purpose: it cannot be forgotten. */
#bar.ball #badge,#bar.ball #ring{display:none}
/* The loading mark is a ring AROUND the whale: the animal stays, the ring turns.
   Drawn as a plain HTML element with a border (the classic CSS spinner) rather
   than an SVG arc: Android's WebView rotates a bordered div with a composited
   transform on every device, while CSS transforms on SVG children and
   stroke-dasharray animation are the ones that silently do nothing there.
   28 px across, 2.5 px stroke, centred on the whale, one turn per 1.1 s. */
#ring{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;
  box-sizing:border-box;display:none;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.18);border-top-color:#fff;
  pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
#bar.spinning #ring{display:block;animation:spin 1.1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* Reduced motion: the ring is there, it just does not turn. */
@media (prefers-reduced-motion:reduce){
  #bar.spinning #ring{animation:none}
}
/* 6 dp above and below the text: a two-line line no longer sits flush against the
   capsule's edges, and the whale (centred, unchanged) keeps its own square. */
/* The user's own ball settings, applied by ComposerUI.settings() below. Text height
   follows the line count instead of the hardcoded 3; nothing here changes display, so
   the bubble's flex layout is untouched. */
  body.no-status #bubbleText{display:none!important}
  body.no-ring #ring{display:none!important}
  body.no-ring #bar.spinning #ring{display:none!important}
  #bubbleText{max-height:calc(var(--lines, 3) * 20px)}
  #bubbleText{display:none;flex:0 0 auto;width:max-content;padding:6px 16px;color:var(--ink);
  font:400 15px/20px var(--font);text-align:center;white-space:normal;word-break:break-word;
  overflow-wrap:anywhere;max-height:100%;overflow:hidden}
#bar.bubble #bubbleText{display:block}
/* Off-screen twin of that text: a bubble starts while the window is still the
   ball, so its width has to be measurable before the window has grown. */
#measure{position:absolute;left:-10000px;top:0;visibility:hidden;width:max-content;
  font:400 15px/20px var(--font);padding:6px 16px;white-space:normal;word-break:break-word;
  overflow-wrap:anywhere}
/* side="right": the ball's right edge is the window's right edge, so the whale
   and the buttons swap ends and the capsule still grows out of the ball. */
#bar.mirror{flex-direction:row-reverse}
#cap{position:relative;flex:none;width:var(--size);height:var(--size);display:grid;place-items:center}
#whale,#plane{position:absolute;display:block}
#whale{width:62%;height:62%}
#plane{width:46%;height:46%;opacity:0}
#field{flex:1 1 auto;min-width:0;height:100%;display:flex;align-items:center}
#text{flex:1 1 auto;min-width:0;height:100%;margin:0;border:0;outline:0;background:transparent;color:var(--ink);
  caret-color:var(--ink);font:400 15px/1 var(--font);padding:0 8px 0 4px;-webkit-appearance:none;appearance:none}
#text::placeholder{color:rgba(255,255,255,.45)}
#bar.mirror #text{text-align:right}
#send,#close{flex:none;display:grid;place-items:center;margin:0;padding:0;border:0;background:transparent;
  color:var(--ink);-webkit-appearance:none;appearance:none;cursor:pointer}
#send{width:var(--size);height:var(--size)}
#send svg{width:46%;height:46%;display:block;pointer-events:none}
#close{width:calc(var(--size) - 12px);height:100%;color:rgba(255,255,255,.45)}
#close svg{width:40%;height:40%;display:block;pointer-events:none}
#send:active,#close:active{background:rgba(255,255,255,.12);border-radius:999px}
#close:active{color:#fff}
/* Closed: only the whale. Open: the field and ✕ fade in. The plane that flew in
   lands on the ball's own square and BECOMES the send button: `landed` drops the
   cap and gives #send its place — both are exactly `--size` at the same spot, so
   the swap is invisible and there is never a second paper plane on screen.
   #send therefore has to switch instantly (no fade): a fade would leave the
   landed plane and the button's plane on screen together for 160 ms. */
#field,#close{opacity:0;pointer-events:none;transition:opacity .16s ease}
#send{opacity:0;pointer-events:none;transition:none}
#bar.open #field,#bar.open #close{opacity:1;pointer-events:auto}
#bar.landed #cap{display:none}
#bar.landed #send{opacity:1;pointer-events:auto}
/* Listening: an inset ring, not an outer one — an outer glow would be cut off by
   the window the capsule exactly fills. */
#bar.listening::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:999px;
  pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,255,255,.45);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:inset 0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:inset 0 0 0 12px rgba(255,255,255,0)}100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){#bar.ball{animation:none}#bar.listening::after{animation:none}}
</style>
</head>

  <div id="cap">
    <div id="badge" aria-hidden="true"></div>

    <svg id="whale" viewBox="0 0 108 108" aria-hidden="true">
                <g transform="translate(25.92,25.92) scale(1.1232)">
                  <path fill="#fff" fill-rule="nonzero" d="M48.8354 10.0479C48.3232 9.79199 48.1025 10.2798 47.8032 10.5278C47.7007 10.6079 47.6143 10.7119 47.5273 10.8076C46.7793 11.624 45.9048 12.1597 44.7622 12.0957C43.0923 12 41.666 12.5356 40.4058 13.8398C40.1377 12.2319 39.2476 11.272 37.8926 10.6558C37.1836 10.3359 36.4668 10.0156 35.9702 9.31982C35.6235 8.82373 35.5293 8.27197 35.356 7.72754C35.2456 7.3999 35.1353 7.06396 34.7651 7.00781C34.3633 6.94385 34.2056 7.2876 34.0479 7.57568C33.418 8.75195 33.1733 10.0479 33.1973 11.3599C33.2524 14.312 34.4736 16.6641 36.8999 18.3359C37.1758 18.5278 37.2466 18.7197 37.1597 19C36.9946 19.5757 36.7974 20.1357 36.624 20.7119C36.5137 21.0801 36.3486 21.1597 35.9624 21C34.6309 20.4321 33.481 19.5918 32.4644 18.5757C30.7393 16.8721 29.1792 14.9917 27.2334 13.52C26.7764 13.1758 26.3193 12.856 25.8467 12.5518C23.8618 10.584 26.1069 8.96777 26.627 8.77588C27.1704 8.57568 26.8159 7.8877 25.0591 7.896C23.3022 7.90381 21.6953 8.50391 19.647 9.30371C19.3477 9.42383 19.0322 9.51172 18.7095 9.58398C16.8501 9.22363 14.9199 9.14355 12.9033 9.37598C9.10596 9.80762 6.07275 11.6396 3.84326 14.7681C1.16455 18.5278 0.53418 22.7998 1.30664 27.2559C2.11768 31.9521 4.46582 35.8398 8.07373 38.8799C11.8159 42.0322 16.1255 43.5762 21.041 43.2803C24.0269 43.104 27.3516 42.6963 31.1016 39.4561C32.0469 39.936 33.0396 40.1279 34.686 40.272C35.9546 40.3921 37.1758 40.208 38.1211 40.0078C39.6021 39.688 39.4995 38.2881 38.9639 38.0322C34.623 35.9678 35.5762 36.8081 34.71 36.1279C36.9155 33.4639 40.2402 30.6958 41.54 21.728C41.6426 21.0161 41.5557 20.5679 41.54 19.9917C41.5322 19.6396 41.6108 19.5039 42.0049 19.4639C43.0923 19.3359 44.1479 19.0317 45.1167 18.4878C47.9292 16.9199 49.064 14.3438 49.3315 11.2559C49.3711 10.7837 49.3237 10.2959 48.8354 10.0479ZM24.3262 37.8398C20.1196 34.4639 18.0791 33.3521 17.2358 33.3999C16.4482 33.4482 16.5898 34.3682 16.7632 34.9678C16.9443 35.5601 17.1812 35.9683 17.5117 36.4878C17.7402 36.832 17.8979 37.3442 17.283                 </g>
              </svg>
    <svg id="plane" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#fff" d="M2.7 11.5 21.1 3.3c.7-.3 1.4.3 1.2 1L19.2 20c-.2.9-1.3 1.1-1.8.3L14 15.1l-3.4 3.1c-.6.6-1.6.1-1.5-.8l.3-3.8-6.6-1.1c-.6-.1-.6-.8-.1-1Z"/>
      <path fill="#fff" fill-opacity=".75" d="M9.4 13.6 21.6 4.9 10.9 15.9Z"/>
    </svg>
  </div>
  <button id="send" type="button" aria-label="发送">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#fff" d="M2.7 11.5 21.1 3.3c.7-.3 1.4.3 1.2 1L19.2 20c-.2.9-1.3 1.1-1.8.3L14 15.1l-3.4 3.1c-.6.6-1.6.1-1.5-.8l.3-3.8-6.6-1.1c-.6-.1-.6-.8-.1-1Z"/>

  </button>
  <button id="close" type="button" aria-label="收起">
    <svg viewBox="0 0 24 24" aria-hidden="true">

    </svg>
  </button>
  <div id="field">
    <input id="text" type="text" enterkeyhint="send" autocomplete="off" spellcheck="false"
           autocapitalize="off" inputmode="text" placeholder="例如：把我刚才那条消息发到微信里">
  </div>
  <div id="bubbleText" role="status" aria-live="polite"></div>
</div>
<div id="measure" aria-hidden="true"></div>
<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ bridge
   * window.DshBall      the ball: size/pad/x/y/side/image, plus the actions.
   * window.DshComposer  this bar: send(text), close(), ime(), log(text).
   *
   * Every number DshBall publishes is dp, and in this WebView dp == CSS px, so
   * there is no density maths on this side. Calls are dispatched by the number of
   * arguments: Android silently drops a call whose count does not match the Java
   * signature, which is what made "tapping does nothing" and "close does
   * nothing" look like dead buttons.
   */
  function fromBall(name) {
    try {
      var B = window.DshBall;
      if (!B) return undefined;
      var value = B[name];
      return typeof value === "function" ? value.call(B) : value;
    } catch (error) { return undefined; }
  }
  function numFrom(name) {
    var raw = fromBall(name);
    if (raw === null || raw === undefined || raw === "") return NaN;
    return Number(raw);
  }
  function call(target, method, count, a, b) {
    try {
      if (target && typeof target[method] === "function") {
        if (count <= 0) return target[method]();
        if (count === 1) return target[method](a);
        return target[method](a, b);
      }
    } catch (error) { /* no bridge: the page is a plain web page, stay silent */ }
    return undefined;
  }
  function toBall(method, a, b) {
    return call(window.DshBall, method, arguments.length - 1, a, b);
  }
  function toComposer(method, a, b) {
    return call(window.DshComposer, method, arguments.length - 1, a, b);
  }

  var bar = document.getElementById("bar");
  var cap = document.getElementById("cap");
  var whale = document.getElementById("whale");
  var plane = document.getElementById("plane");
  var input = document.getElementById("text");
  var send = document.getElementById("send");
  var close = document.getElementById("close");
  var bubbleEl = document.getElementById("bubbleText");
  var badgeEl = document.getElementById("badge");
  var ringEl = document.getElementById("ring");
  var measureEl = document.getElementById("measure");

  var DEFAULT_SIZE = 58;   // dp, the app's default ball diameter
  var PLACEHOLDER = "例如：把我刚才那条消息发到微信里";
  var LISTEN_PLACEHOLDER = "正在听…";

  /* Anything that throws in here is invisible in a WebView with no console, so
     errors go back through the same bridge as everything else. */
  window.addEventListener("error", function (event) {
    toBall("log", "composer.html JS error: " + (event && event.message ? event.message : "?")
      + " @" + (event && event.lineno ? event.lineno : 0)
      + " bridge=" + (window.DshComposer ? "yes" : "no"));
  });

  /* ----------------------------------------------------------------- helpers */
  function f2(value) { return (Math.round(Number(value) * 100) / 100).toFixed(2); }
  function reduced() {
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch (error) { return false; }
  }
  function ms(value) { return reduced() ? 0 : value; }
  function sleep(value) {
    return new Promise(function (resolve) { window.setTimeout(resolve, value); });
  }
  /* Only animations this page started are tracked, so cancelling never kills the
     CSS breathe animation. */
  var live = { whale: null, plane: null, press: null };
  function play(name, element, frames, options) {
    stop(name);
    var animation = null;
    try {
      if (element && element.animate) animation = element.animate(frames, options);
    } catch (error) { /* no WAAPI */ }
    live[name] = animation;
    return animation;
  }
  function stop(name) {
    var animation = live[name];
    live[name] = null;
    if (animation) { try { animation.cancel(); } catch (error) { /* ignore */ } }
  }
  /* Every morph is a chain of timed phases. `morph` is the generation counter: a
     new expand/collapse bumps it, and every pending phase of the old sequence
     turns into a no-op instead of fighting the new one. */
  var morph = 0;
  function step(generation, millis, run) {
    return sleep(ms(millis)).then(function () {
      if (generation !== morph) return false;
      run();
      return true;
    });
  }

  /* ---------------------------------------------------------------- geometry
   * The window is placed by the app in whole DEVICE pixels (1/2.75 of a CSS
   * pixel), so the page's rect has to come from the same numbers the app uses
   * rather than from a rounded offsetTop: innerWidth/innerHeight are the window
   * in CSS px, and the capsule is `size` tall, centred in it.
   *
   * `origin` is where the app says the window's top-left is (ComposerUI.at), in
   * dp. The page cannot see that by itself — and the app's log plus this page's
   * "rect=" line are the two halves of the alignment check.
   */
  var DEFAULT_PAD = 12;    // dp, only used if the bridge is missing
  var size = DEFAULT_SIZE;
  var origin = { x: 0, y: 0 };
  var expanded = false;
  var collapsing = false;
  var listening = false;
  var scale = 1;

  function viewWidth() {
    var vv = window.visualViewport ? window.visualViewport.width : 0;
    var w = window.innerWidth || 0;
    var d = (document.documentElement && document.documentElement.clientWidth) || 0;
    return Math.max(vv || 0, w, d) || 360;
  }
  function viewHeight() {
    var vv = window.visualViewport ? window.visualViewport.height : 0;
    var h = window.innerHeight || 0;
    var d = (document.documentElement && document.documentElement.clientHeight) || 0;
    return Math.max(vv || 0, h, d) || 640;
  }
  function appSize() {
    var value = Math.round(numFrom("size"));
    return (isFinite(value) && value > 0) ? value : DEFAULT_SIZE;
  }
  function appPad() {
    var value = numFrom("pad");
    return (isFinite(value) && value >= 0) ? value : DEFAULT_PAD;
  }
  function mirrored() { return fromBall("side") === "right"; }
  function applySize(next) {
    var value = Number(next);
    if (isFinite(value) && value > 0) size = Math.max(16, Math.round(value));
    document.documentElement.style.setProperty("--size", size + "px");
  }
  function setMirror() {
    if (mirrored()) bar.classList.add("mirror");
    else bar.classList.remove("mirror");
  }
  /** Where the capsule is on the screen, in dp == CSS px. */
  function screenRect() {
    var width = viewWidth();
    var height = viewHeight();
    return {
      left: origin.x,
      top: origin.y + (height - size) / 2,
      width: width,
      height: size
    };
  }
  function rectText(rect) {
    if (!rect) return "?";
    return f2(rect.left) + "," + f2(rect.top) + " " + f2(rect.width) + "x" + f2(rect.height);
  }
  /** The geometry the app can check against `dumpsys window` without a photo. */
  function report(tag) {
    toBall("log", "composer.html " + tag + " rect=" + rectText(screenRect())
      + " origin=" + f2(origin.x) + "," + f2(origin.y)
      + " inner=" + viewWidth() + "x" + viewHeight()
      + " size=" + size + " side=" + (mirrored() ? "right" : "left")
      + " expanded=" + expanded);
  }

  /* ------------------------------------------------------------------ press
   * The app's gesture listener calls BallUI.pointer(...). The ball is the window
   * itself here, so the feedback is a press scale and nothing positional: the
   * app moves the window, the page only reacts to the finger.
   */
  function applyScale(value) {
    scale = value;
    bar.style.transform = value === 1 ? "" : "scale(" + value + ")";
  }
  function pressTo(next, millis) {
    var from = scale;
    var animation = play("press", bar,
      [{ transform: "scale(" + from + ")" }, { transform: "scale(" + next + ")" }],
      { duration: ms(millis), fill: "forwards", easing: "ease-out" });
    scale = next;
    if (animation && animation.finished && animation.finished.then) {
      animation.finished.then(function () {
        if (live.press === animation) { stop("press"); applyScale(scale); }
      }).catch(function () { /* cancelled */ });
    } else {
      applyScale(next);
    }
  }
  function pointer(kind, dx, dy) {
    if (kind === "down") { if (!expanded) pressTo(0.94, 110); return; }
    if (kind === "move" || kind === "drop") {
      if (!expanded) pressTo(1, 130);
      return;
    }
    if (kind === "hold") { setListening(true); return; }
    if (kind === "lift") {
      if (listening) setListening(false);
      if (!expanded) pressTo(1, 130);
      return;
    }
    // Unknown kind: ignore. The page must never throw on a bridge call.
  }

  /* ------------------------------------------------------------------- morph
   * The app owns the window: it grows the ball's square onto the bar's rect over
   * 400 ms. This page owns what is inside it:
   *
   *   expand()    whale out 160 ms -> the plane flies in from the lower outer
   *               corner over 240 ms -> the field and the buttons fade in as the
   *               capsule passes the ball's width.
   *   collapse()  the plane flies back out 180 ms -> the whale fades in 200 ms,
   *               while the app shrinks the window back onto the ball.
   *
   * Neither sequence touches the window or a rect: the window IS the capsule.
   */
  function expand() {
    if (expanded) return;
    expanded = true;
    collapsing = false;
    // The bar and the bubble are the same window: opening the bar cancels any
    // bubble that was showing, including a pending fold-back animation.
    bubbleGen++;
    stopBubbleTimers();
    bubblePhase = "";
    bubbleLabel = "";
    lastBubbleWidth = 0;
    lastBubbleHeight = 0;
    bar.classList.remove("bubble");
    var generation = ++morph;
    applySize(appSize());
    setMirror();
    bar.classList.remove("ball", "landed");
    bar.classList.add("full");
    stop("whale");
    stop("plane");
    stop("press");
    applyScale(1);
    whale.style.opacity = "1";
    whale.style.transform = "";
    plane.style.opacity = "0";
    plane.style.transform = "";

    var whaleOut = play("whale", whale,
      [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(.8)" }],
      { duration: ms(160), fill: "forwards", easing: "ease-out" });
    if (!whaleOut) whale.style.opacity = "0";

    var fromX = mirrored() ? -28 : 28;
    step(generation, 160, function () {
      var flight = play("plane", plane,
        [{ opacity: 0, transform: "translate(" + fromX + "px,28px) scale(.6)" },
         { opacity: 1, transform: "translate(0,0) scale(1)" }],
        { duration: ms(240), fill: "forwards", easing: "cubic-bezier(.22,1.2,.36,1)" });
      if (!flight) plane.style.opacity = "1";
    });
    // 200 ms in, the window is already wider than the ball: the field can fade
    // in without ever being squeezed into the ball's width.
    step(generation, 200, function () {
      if (expanded) bar.classList.add("open");
    });
    step(generation, 400, function () {
      if (!expanded) return;
      // The window's own rect is logged by the app and by ComposerUI.at(); this
      // line only says the page's half of the morph is over.
      toBall("log", "composer.html morph done size=" + size
        + " side=" + (mirrored() ? "right" : "left"));
    });
  }

  function resetVisual() {
    badgeEl.textContent = "";
    badgeEl.style.display = "none";
    toBall("log", "composer.html folded: badge=" + badgeEl.style.display
      + " spinning=" + bar.classList.contains("spinning")
      + " ball=" + bar.classList.contains("ball"));
    stop("whale");
    stop("plane");
    stop("press");
    stop("bubbleText");
    stopBubbleTimers();
    bubbleGen++;
    bubblePhase = "";
    bubbleLabel = "";
    lastBubbleWidth = 0;
    lastBubbleHeight = 0;
    bubbleEl.style.opacity = "";
    expanded = false;
    collapsing = false;
    bar.classList.remove("bubble", "open", "full", "landed", "listening");
    bar.classList.add("ball");
    applyScale(1);
    applySize(appSize());
    setMirror();
    whale.style.opacity = "1";
    whale.style.transform = "";
    plane.style.opacity = "0";
    plane.style.transform = "";
    listening = false;
    input.setAttribute("placeholder", PLACEHOLDER);
    // No rect report here: the app moves the window onto the ball and pushes the
    // new origin (ComposerUI.at), and that "at" line is the one that gets
    // compared with the window's frame. A rect logged from here would be the
    // stale, pre-snap origin.
    toBall("log", "composer.html ball back size=" + size
      + " side=" + (mirrored() ? "right" : "left"));
  }

  function collapse() {
    if (collapsing) return;
    if (!expanded) { resetVisual(); return; }
    expanded = false;
    collapsing = true;
    var generation = ++morph;
    // The send button was standing in for the landed plane; the cap takes the
    // plane back over at the very same pixel, so the hand-off is invisible.
    bar.classList.remove("open", "full", "landed");
    stop("whale");
    stop("plane");
    stop("press");
    applyScale(1);

    // The plane is where the whale was: it flies back out the way it came.
    var outX = mirrored() ? -28 : 28;
    var out = play("plane", plane,
      [{ opacity: 1, transform: "translate(0,0) scale(1)" },
       { opacity: 0, transform: "translate(" + outX + "px,28px) scale(.6)" }],
      { duration: ms(180), fill: "forwards", easing: "ease-in" });
    if (!out) plane.style.opacity = "0";

    step(generation, 180, function () {
      var back = play("whale", whale,
        [{ opacity: 0, transform: "scale(.8)" }, { opacity: 1, transform: "scale(1)" }],
        { duration: ms(200), fill: "forwards", easing: "ease-out" });
      if (!back) whale.style.opacity = "1";
    }).then(function (live1) {
      if (!live1) return null;
      return step(generation, 200, function () {
        resetVisual();
      });
    });
  }

  function collapseDone() {
    // The app tears its focus down in the same frame it calls collapse(); a hard
    // reset while the shrink is still running would cut the animation, so this
    // only resets once the page's own sequence is over.
    if (collapsing) return;
    resetVisual();
  }

  /* ------------------------------------------------------------------- field */
  function focus() {
    try { input.focus(); } catch (error) { /* the window may not be focusable yet */ }
  }
  function submit() {
    var value = (input.value || "").trim();
    if (value === "") { focus(); return; }
    input.value = "";
    toComposer("send", value);
    focus();   // ready for the next line; the app closes the bar when it wants to
  }
  function heard(value) {
    var text = (value === null || value === undefined) ? "" : String(value);
    if (text === "") return;
    input.value = text;
    focus();
    try { input.setSelectionRange(text.length, text.length); } catch (error) { /* ignore */ }
  }
  function setListening(on) {
    listening = !!on;
    if (listening) bar.classList.add("listening");
    else bar.classList.remove("listening");
    input.setAttribute("placeholder", listening ? LISTEN_PLACEHOLDER : PLACEHOLDER);
  }
  /** The app calls this once the window is on the bar's rect and focusable. */
  function open() {
    applySize(appSize());
    setMirror();
    // The morph is over: the plane has landed on the ball's square, and from
    // here on the send button IS that plane. `landed` hides the cap and shows
    // #send in its place (same size, same spot, same icon) — the whole point is
    // that the bar never shows two paper planes.
    bar.classList.remove("ball");
    bar.classList.add("full", "open", "landed");
    expanded = true;
    focus();
    toComposer("ime");
  }
  /** Where the app says this window's top-left is, in dp (see screenRect). */
  function at(x, y) {
    var nx = Number(x);
    var ny = Number(y);
    if (isFinite(nx)) origin.x = nx;
    if (isFinite(ny)) origin.y = ny;
    // The window has just been moved/resized by the app; one re-measure a frame
    // later is what the app's own log line is compared against. Not a watchdog:
    // it runs once per move and only writes a log line.
    window.setTimeout(function () { report("at"); }, 60);
  }

  send.addEventListener("mousedown", function (event) {
    // Keep the input focused (and the keyboard up): a plain button press would
    // move focus off the field.
    event.preventDefault();
  });
  send.addEventListener("click", function (event) {
    event.preventDefault();
    event.stopPropagation();
    submit();
  });
  close.addEventListener("mousedown", function (event) { event.preventDefault(); });
  close.addEventListener("click", function (event) {
    event.preventDefault();
    event.stopPropagation();
    toComposer("close");
  });
  // Tapping the whale is "tap the ball again": the one gesture the user already
  // knows closes the bar.
  cap.addEventListener("click", function (event) {
    event.preventDefault();
    event.stopPropagation();
    toComposer("close");
  });
  bar.addEventListener("click", function (event) {
    if (event.target !== send && event.target !== close && event.target !== cap) focus();
  });
  input.addEventListener("keydown", function (event) {
    var key = event.key;
    var code = event.keyCode;
    if (key === "Enter" || code === 13) { event.preventDefault(); submit(); return; }
    if (key === "Escape" || code === 27) { event.preventDefault(); toComposer("close"); return; }
    // Backspace on an empty field used to close the bar. That looked like a
    // gesture but read as a bug: delete the last character, press backspace once
    // more, and the bar vanished mid-typing. Deleting is now just deleting.
  });

  /* ------------------------------------------------------------------ bubble
   * The status the user reads, drawn by the ball itself.
   *
   * The app stretches this window off the ball's square; the page only fills it
   * and decides HOW WIDE the line needs to be (only the page can measure text).
   * The measurement happens in `#measure`, an off-screen twin of the text block,
   * because when a bubble starts the window is still only as wide as the ball.
   *
   *   work   the line the caller gave, ring turning
   *   think  one fixed line, 思考中, ring turning (it used to cycle three words every 1.4 s,
   *          which the user read as "changing too fast" — a loading line that
   *          rewrites itself faster than it can be read is noise, not feedback)
   *   done   ✓ + the line (the app folds it back after 2.6s)
   *   say    a plain line, no frame ("你：…", a delivery result)
   */
  /** The one thinking line. Fixed on purpose: no word cycling, no timer. */
  var THINK_LABEL = "思考中";
  var BUBBLE_LINES = 3;
  var BUBBLE_LINE = 20;      // px, the line-height in the CSS above
  var BUBBLE_VPAD = 12;      // 6 px above and below the text (must match the CSS)
  var BUBBLE_PAD = 32;       // 16 px of padding on each side
  var bubblePhase = "";
  var bubbleLabel = "";
  var lastSpin = false;
  var bubbleGen = 0;
  var lastBubbleWidth = 0;
  var lastBubbleHeight = 0;

  function stopBubbleTimers() {
    // Nothing cycles any more (the thinking line is fixed and the running state
    // is a CSS animation); all that is left to undo is the class. Leaving it
    // behind would leave the spinner turning over the whale after the status is
    // gone.

    bar.classList.remove("spinning");
    lastSpin = false;
  }
  /** The screen width in dp — the page's own `vw` is this small window. */
  function screenDp() {
    var value = numFrom("screen");
    if (isFinite(value) && value > 0) return value;
    var cx = numFrom("x");      // the ball's centre: never 0 in practice
    if (isFinite(cx) && cx > 0) return Math.max(320, cx * 2);
    return 360;
  }
  function maxBubbleWidth() { return Math.max(48, Math.min(screenDp() / 2, screenDp())); }
  /* The line is the status text alone. The phase marker is a badge on the whale
     (see #badge), so the whale is never displaced and never dropped. */
  function bubbleLine() { return bubbleLabel; }
  /** Only the ✓ is a glyph now; the running state is the spinner. */
  function bubbleBadge() {
    return bubblePhase === "done" ? "\u2713" : "";
  }
  function applyBadge() {
    // The ring is a boolean state, not a per-phase one: thinking and working both
    // turn it on, so switching between them leaves the class (and therefore the
    // CSS animation) untouched — no restart, no flicker.
    var spin = bubblePhase === "work" || bubblePhase === "think";
    if (spin !== lastSpin) {
      if (spin) bar.classList.add("spinning"); else bar.classList.remove("spinning");
      lastSpin = spin;
      if (spin && ringEl) {
        // Proof, from the device, that this is a CSS animation and not frames.
        var style = window.getComputedStyle ? window.getComputedStyle(ringEl) : null;
        toBall("log", "composer.html ring animation=" + (style ? style.animationName : "?")
          + " duration=" + (style ? style.animationDuration : "?")
          + " iteration=" + (style ? style.animationIterationCount : "?")
          + " timing=" + (style ? style.animationTimingFunction : "?")
          + " display=" + (style ? style.display : "?"));
      }
    }
    var mark = bubbleBadge();
    badgeEl.textContent = mark;
    badgeEl.style.display = mark === "" ? "none" : "grid";
  }
  function renderBubble() {
    var line = bubbleLine();
    // The text may use what is left after the whale's own square: the capsule is
    // whale + text, so the width measured below is the TEXT block only and the
    // whale's `size` is added to it. Measuring the text as if it were the whole
    // capsule is what would clip the tail.
    var textCap = Math.max(24, Math.round(maxBubbleWidth()) - size - BUBBLE_PAD);
    bubbleEl.textContent = line;
    bubbleEl.style.maxWidth = textCap + "px";
    measureEl.textContent = line;
    measureEl.style.maxWidth = textCap + "px";
    applyBadge();
    var textWidth = Math.ceil(measureEl.offsetWidth);
    var height = Math.ceil(measureEl.offsetHeight);
    if (!isFinite(textWidth) || textWidth <= 0) return;
    // The ball's own height is the floor (a one-line bubble IS the ball, grown
    // sideways); three rows plus the vertical padding is the ceiling. Between the
    // two the capsule grows row by row — 40 / 52 / 72 dp — instead of squeezing
    // two lines into the ball's 40 dp.
    var wantedWidth = Math.max(size, Math.min(size + textWidth, Math.round(maxBubbleWidth())));
    var wantedHeight = Math.max(size,
      Math.min(height, BUBBLE_LINES * BUBBLE_LINE + BUBBLE_VPAD));
    if (wantedWidth === lastBubbleWidth && wantedHeight === lastBubbleHeight) return;
    lastBubbleWidth = wantedWidth;
    lastBubbleHeight = wantedHeight;
    toBall("bubbleSize", wantedWidth, wantedHeight);
    toBall("log", "composer.html bubble phase=" + bubblePhase + " chars=" + line.length
      + " box=" + wantedWidth + "x" + wantedHeight
      + " whale=" + size + " text=" + textWidth
      + " screen=" + Math.round(screenDp()) + " cap=" + Math.round(maxBubbleWidth()));
  }
  /** A status, rendered on the ball. The app does the window, this does the text. */
  function bubble(phase, text) {
    if (expanded) return;                     // the typing bar owns the window
    var wanted = (phase === null || phase === undefined || phase === "") ? "idle" : String(phase);
    var label = (text === null || text === undefined) ? "" : String(text);
    if (wanted === "idle") { bubbleDone(); return; }
    if (label === "" && wanted !== "think") { bubbleDone(); return; }
    bubbleGen++;
    stopBubbleTimers();
    stop("whale");
    stop("plane");
    stop("press");
    stop("bubbleText");
    bubbleEl.style.opacity = "";
    bubblePhase = wanted;
    bubbleLabel = label;
    // "思考中" is for thinking only: a work status keeps the line it was given,
    // so a tool call never reads as thinking.
    if (wanted === "think" && bubbleLabel === "") bubbleLabel = THINK_LABEL;
    lastBubbleWidth = 0;
    lastBubbleHeight = 0;
    applySize(appSize());
    setMirror();
    bar.classList.remove("ball", "open", "full", "landed");
    bar.classList.add("bubble");
    // The whale is the bubble's left cap and the square it already occupied: it
    // simply stays where it was while the capsule grows out of it.
    whale.style.opacity = "1";
    whale.style.transform = "";
    plane.style.opacity = "0";
    plane.style.transform = "";
    renderBubble();
  }
  /** The app shrank the window back onto the ball: the whale comes back. */
  function bubbleDone() {
    stopBubbleTimers();
    // The ✓ belongs to the bubble: on the way back into the ball it goes, or the
    // ball's circular clip cuts it into a stray corner mark.
    badgeEl.textContent = "";
    badgeEl.style.display = "none";
    var generation = ++bubbleGen;
    bubblePhase = "";
    bubbleLabel = "";
    lastBubbleWidth = 0;
    lastBubbleHeight = 0;
    if (!bar.classList.contains("bubble")) return;
    var fade = play("bubbleText", bubbleEl,
      [{ opacity: 1 }, { opacity: 0 }],
      { duration: ms(130), fill: "forwards", easing: "ease-in" });
    if (!fade) bubbleEl.style.opacity = "0";
    window.setTimeout(function () {
      if (generation !== bubbleGen) return;     // a new bubble took over
      if (expanded) return;                     // the bar took over
      stop("bubbleText");
      bubbleEl.style.opacity = "";
      bar.classList.remove("bubble");
      bar.classList.add("ball");
      toBall("log", "composer.html folded: badge=" + badgeEl.style.display
        + " mark=" + JSON.stringify(badgeEl.textContent)
        + " spinning=" + bar.classList.contains("spinning")
        + " ball=" + bar.classList.contains("ball"));
      applySize(appSize());
      setMirror();
      plane.style.opacity = "0";
      plane.style.transform = "";
      var back = play("whale", whale,
        [{ opacity: 0, transform: "scale(.85)" }, { opacity: 1, transform: "scale(1)" }],
        { duration: ms(170), fill: "forwards", easing: "ease-out" });
      if (!back) whale.style.opacity = "1";
      toBall("log", "composer.html ball back size=" + size
        + " side=" + (mirrored() ? "right" : "left"));
    }, ms(130));
  }

  /** Called by the app (evaluateJavascript) and once at load with the stored values.
   *  Hot by construction: applying is just reading, so the ball never reloads for it. */
  window.__dshBallSettings = function (s) {
    s = s || {};
    var flag = function (v, d) { return v === undefined || v === null ? d : v === true; };
    var lines = Math.max(1, Math.min(3, parseInt(s.ballBubbleLines, 10) || 3));
    var status = flag(s.ballShowStatus, true), think = flag(s.ballShowThink, true), ring = flag(s.ballShowRing, true);
    document.body.classList.toggle("no-status", !status);
    document.body.classList.toggle("no-ring", !ring);
    document.documentElement.style.setProperty("--lines", String(lines));
    window.__dshBallThink = think;
    window.__dshBallSettingsApplied = true;
    console.log("ball settings applied: status=" + (status ? "on" : "off")
      + " think=" + (think ? "on" : "off") + " ring=" + (ring ? "on" : "off") + " lines=" + lines);
    return true;
  };
  window.ComposerUI = {
    // The app pushes settings through this entry (see BallService.applySettings).
    settings: window.__dshBallSettings,
    open: open,
    at: at,
    heard: heard,
    setListening: setListening,
    close: function () { toComposer("close"); },
    size: function (dp) { applySize(dp); },
    rect: function () { return rectText(screenRect()); }
  };

  /* The app drives the ball through BallUI, exactly as it did when the ball was
     drawn in its own window. Everything that used to move a rect in here is now
     the app moving the window, so pointer() only does the press feedback. */
  window.BallUI = {
    expand: expand,
    collapse: collapse,
    collapseDone: collapseDone,
    requestCollapse: function () { toComposer("close"); },
    pointer: pointer,
    bubble: bubble,
    bubbleDone: bubbleDone,
    say: function (text) { bubble("say", text); },
    setSize: function (dp) { applySize(dp); },
    size: function (dp) { applySize(dp); },
    setListening: setListening,
    heard: heard,
    heardPartial: heard,
    refresh: function () {
      applySize(appSize());
      setMirror();
      report("refresh");
    },
    isExpanded: function () { return expanded; },
    // Additive, read-only: the capsule's rect on the screen, in dp, so the app's
    // log can answer "is the page's capsule on the window's frame?" with numbers.
    rect: function () { return rectText(screenRect()); }
  };

  window.addEventListener("resize", function () {
    // The app resizes this window every frame of the morph, so this listener
    // must stay silent: 24 log lines per expand would bury the one "at" line the
    // alignment check reads.
    setMirror();
  });

  /* -------------------------------------------------------------------- boot */
  function applyImage() {
    // Whatever the settings page picked; otherwise the built-in brand whale.
    var chosen = fromBall("image");
    if (typeof chosen !== "string" || chosen === "") return;
    if (!/\.(png|jpe?g|webp)$/i.test(chosen)) return;
    var current = document.getElementById("whale");
    if (!current || !current.parentNode) return;
    if (String(current.tagName || "").toUpperCase() === "IMG") {
      current.src = "file://" + chosen;
      return;
    }
    var picture = document.createElement("img");
    picture.id = "whale";
    picture.alt = "";
    picture.style.cssText = "width:62%;height:62%;object-fit:contain;display:block;";
    picture.src = "file://" + chosen;
    current.parentNode.replaceChild(picture, current);
    whale = picture;
  }

  applyImage();
  applySize(appSize());
  setMirror();
  input.setAttribute("placeholder", PLACEHOLDER);
  report("boot");
  toBall("log", "composer.html boot pad=" + appPad()
    + " bridge=" + (window.DshComposer ? "yes" : "no"));
})();
</script>
</body>
</html>
