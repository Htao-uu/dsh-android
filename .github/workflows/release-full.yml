name: release-full

# Build the full update package (the APK that carries payload/rootfs) on GitHub's
# runners instead of on a phone.
#
# Manual only, on purpose: one run costs 10–15 minutes of Actions time (the rootfs
# download + `npm i` dominate). Do not add a push trigger.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布到哪个 tag（必须已存在，例如 v1.2.0）"
        required: true
        type: string
      dry_run:
        description: "只构建、不发布"
        required: false
        type: boolean
        default: false

# Publishing needs the built-in token's contents:write; no PAT required.
permissions:
  contents: write

jobs:
  full:
    # x86_64 on purpose: Google publishes build-tools (aapt2/d8) for x86_64 only.
    # The arm64 content comes from cross-installation (prepare_rootfs.sh already
    # passes --os=linux --cpu=arm64 --libc=glibc) and cross-compiled linkfix (CC).
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK（android-36 + build-tools）
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: 交叉编译器 + apksig
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          curl -fsSL -o /tmp/apksig.jar \
            https://repo1.maven.org/maven2/com/android/tools/build/apksig/8.7.3/apksig-8.7.3.jar

      - name: 缓存 rootfs（省掉每次约 10 分钟的下载 + npm i）
        uses: actions/cache@v4
        with:
          path: build/rootfs-ubuntu
          key: rootfs-${{ runner.os }}-${{ hashFiles('scripts/prepare_rootfs.sh', 'scripts/trim_payload.sh') }}

      - name: pnpm（不在 git 里，按固定版本 + 双哈希下载）
        run: sh scripts/fetch-pnpm.sh

      - name: PRoot 库（不在 git 里，按固定 sha256 从 release 资产取）
        run: sh scripts/fetch-proot.sh

      - name: 准备 rootfs（ubuntu-base + 官方 node + dsh）
        run: sh scripts/prepare_rootfs.sh

      - name: 组装 payload + 打包
        run: |
          sh scripts/assemble_payload.sh
          python3 scripts/make_payload_zip.py build/rootfs-ubuntu build/payload-assets/payload.zip

      - name: 签名密钥（Secrets → 临时文件，用完随 runner 销毁）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/dsh.p12
          test -s keystore/dsh.p12

      - name: 构建全量 APK + 热包
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-36/android.jar
          AAPT2: ${{ env.ANDROID_HOME }}/build-tools/36.0.0/aapt2
          D8: ${{ env.ANDROID_HOME }}/build-tools/36.0.0/lib/d8.jar
          APKSIG: /tmp/apksig.jar
          PROOT: ${{ github.workspace }}/build/proot/libproot.so
          CC: aarch64-linux-gnu-gcc
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          sh scripts/build_apk.sh
          python3 scripts/make_hot_zip.py . out/dsh-hot.zip
          cd out && sha256sum dsh-android.apk dsh-hot.zip > SHA256SUMS && cat SHA256SUMS

      - name: 发布（复用 release.sh：资产 apk + hot + SHA256SUMS，正文来自 CHANGELOG）
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSH_RELEASE_TAG: ${{ inputs.tag }}
        run: sh scripts/release.sh

      - name: 回读验证（资产存在、latest 归属、URL 可解析）
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          API="https://api.github.com/repos/${{ github.repository }}"
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "$API/releases/latest" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("latest:", d["tag_name"]); [print(" ", a["name"], a["size"], (a.get("digest") or "")[:23]) for a in d["assets"]]'
          for n in dsh-android.apk dsh-hot.zip SHA256SUMS; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L "https://github.com/${{ github.repository }}/releases/latest/download/$n")
            echo "$n -> HTTP $code"
            [ "$code" = "200" ]
          done
